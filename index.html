<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
</head>
<body style="background: #0b1120; color: white; padding: 20px; font-family: sans-serif;">
  <h1>StudyOS Test</h1>
  <p id="test-text">Waiting for Javascript...</p>
  
  <button onclick="alert('The button works!')" style="padding: 20px; font-size: 20px; margin-top: 20px;">Click Me</button>

  <script>
    // This runs as soon as the page opens
    try {
      document.getElementById("test-text").innerHTML = "JavaScript is working! Today is " + new Date().toDateString();
    } catch (error) {
      document.getElementById("test-text").innerHTML = "ERROR: " + error.message;
    }
  </script>
</body>
</html>
